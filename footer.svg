<svg fill="none" viewBox="0 0 900 150" width="900" height="150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Border Gradient -->
    <linearGradient id="footerBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glowing Gradient -->
    <linearGradient id="footerTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Filter Glow -->
    <filter id="footerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="896" height="146" rx="14" fill="url(#footerBg)" stroke="url(#footerBorder)" stroke-width="1.2" />

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="75" r="70" fill="#0284c7" opacity="0.1" filter="url(#footerGlow)" />
  <circle cx="750" cy="75" r="70" fill="#a855f7" opacity="0.1" filter="url(#footerGlow)" />

  <!-- Headline -->
  <text x="450" y="55" text-anchor="middle" fill="url(#footerTextGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" letter-spacing="0.5">
    Have an ambitious AI, Voice, or Full Stack project in mind?
  </text>

  <!-- Subtitle -->
  <text x="450" y="85" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
    Let's build resilient, low-latency, and high-impact systems together.
  </text>

  <!-- Status Indicator Bottom -->
  <g transform="translate(330, 105)">
    <rect width="240" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="16" cy="13" r="4" fill="#10b981"/>
    <text x="28" y="17" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">OPEN TO NEW OPPORTUNITIES</text>
  </g>
</svg>
