<svg fill="none" viewBox="0 0 900 240" width="900" height="240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Text Glow Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Badge Background Gradient -->
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="896" height="236" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Background Decorative Glowing Orbs -->
  <circle cx="120" cy="60" r="80" fill="#0284c7" opacity="0.12" filter="url(#glow)" />
  <circle cx="800" cy="180" r="90" fill="#a855f7" opacity="0.12" filter="url(#glow)" />
  <circle cx="500" cy="120" r="110" fill="#6366f1" opacity="0.08" filter="url(#glow)" />

  <!-- Subtle Circuit / Neural Grid Lines -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3">
    <line x1="40" y1="40" x2="200" y2="40" />
    <line x1="200" y1="40" x2="250" y2="90" />
    <line x1="700" y1="200" x2="850" y2="200" />
    <line x1="650" y1="150" x2="700" y2="200" />
  </g>

  <!-- Status Chip Top Left -->
  <g transform="translate(45, 32)">
    <rect width="180" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#10b981" filter="url(#neon)"/>
    <text x="26" y="17" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">OPEN TO COLLABORATE</text>
  </g>

  <!-- Top Right Metric Badge -->
  <g transform="translate(670, 32)">
    <rect width="185" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="92" y="17" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">⚡ HIGH-PERFORMANCE SYSTEMS</text>
  </g>

  <!-- Main Name Title -->
  <text x="450" y="112" text-anchor="middle" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="1">
    SATISH KUMAR CHAUBEY
  </text>

  <!-- Subtitle / Title -->
  <text x="450" y="148" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" letter-spacing="0.5">
    AI &amp; ML Engineer  •  Full Stack Architect  •  Real-Time Systems
  </text>

  <!-- Feature Pills Bottom Bar -->
  <g transform="translate(100, 180)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="150" height="30" rx="8" fill="url(#badgeBg)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
      <text x="75" y="19" text-anchor="middle" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🧠 LLM &amp; Voice Agents</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(165, 0)">
      <rect width="170" height="30" rx="8" fill="url(#badgeBg)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1" />
      <text x="85" y="19" text-anchor="middle" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">⚡ WebRTC • Twilio • STT</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(350, 0)">
      <rect width="175" height="30" rx="8" fill="url(#badgeBg)" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1" />
      <text x="87" y="19" text-anchor="middle" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🚀 Next.js &amp; Microservices</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(540, 0)">
      <rect width="160" height="30" rx="8" fill="url(#badgeBg)" stroke="#f472b6" stroke-opacity="0.4" stroke-width="1" />
      <text x="80" y="19" text-anchor="middle" fill="#fbcfe8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">💳 Scalable Fintech Core</text>
    </g>
  </g>
</svg>
