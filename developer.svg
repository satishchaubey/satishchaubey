<svg fill="none" viewBox="0 0 850 380" width="850" height="380" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatFast {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.7; filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.4)); }
      50% { opacity: 1; filter: drop-shadow(0 0 18px rgba(168, 85, 247, 0.8)); }
    }
    @keyframes codeBlink {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }
    @keyframes typingHands {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-2px); }
    }

    .badge-float-1 { animation: floatSlow 3.8s ease-in-out infinite; }
    .badge-float-2 { animation: floatFast 3.2s ease-in-out infinite 0.4s; }
    .badge-float-3 { animation: floatSlow 4.2s ease-in-out infinite 0.8s; }
    .badge-float-4 { animation: floatFast 3.5s ease-in-out infinite 1.2s; }
    .badge-float-5 { animation: floatSlow 4s ease-in-out infinite 0.6s; }
    .badge-float-6 { animation: floatFast 3.4s ease-in-out infinite 1.5s; }
    .badge-float-7 { animation: floatSlow 4.4s ease-in-out infinite 0.2s; }
    .screen-glow { animation: pulseGlow 3s ease-in-out infinite; }
    .cursor-blink { animation: codeBlink 0.9s infinite; }
    .hands-typing { animation: typingHands 0.4s ease-in-out infinite; }
  </style>

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="devBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a13"/>
    </linearGradient>

    <!-- Card Border Gradient -->
    <linearGradient id="devBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="ambientLight" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="846" height="376" rx="16" fill="url(#devBg)" stroke="url(#devBorder)" stroke-width="1.5"/>

  <!-- Background Cyber Grid -->
  <g opacity="0.06" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="75" x2="850" y2="75"/>
    <line x1="0" y1="150" x2="850" y2="150"/>
    <line x1="0" y1="225" x2="850" y2="225"/>
    <line x1="0" y1="300" x2="850" y2="300"/>
    <line x1="170" y1="0" x2="170" y2="380"/>
    <line x1="340" y1="0" x2="340" y2="380"/>
    <line x1="510" y1="0" x2="510" y2="380"/>
    <line x1="680" y1="0" x2="680" y2="380"/>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="425" cy="220" r="130" fill="#38bdf8" opacity="0.1" filter="url(#ambientLight)"/>
  <circle cx="425" cy="160" r="90" fill="#a855f7" opacity="0.12" filter="url(#ambientLight)"/>

  <!-- ==================== DESK & PERIPHERALS ==================== -->
  <!-- Desk Surface -->
  <path d="M 160 310 L 690 310 L 670 345 L 180 345 Z" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="195" y="345" width="14" height="25" rx="3" fill="#0f172a"/>
  <rect x="640" y="345" width="14" height="25" rx="3" fill="#0f172a"/>

  <!-- Coffee Mug -->
  <rect x="250" y="280" width="20" height="26" rx="4" fill="#0284c7"/>
  <path d="M 270 286 C 278 286 278 298 270 298" stroke="#0284c7" stroke-width="3" fill="none"/>
  <!-- Steam -->
  <path d="M 256 274 Q 259 268 256 262" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
  <path d="M 263 274 Q 266 268 263 262" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>

  <!-- Desk Mini Plant -->
  <rect x="580" y="288" width="24" height="20" rx="3" fill="#334155"/>
  <path d="M 592 288 Q 580 270 575 262 Q 592 272 592 288" fill="#10b981"/>
  <path d="M 592 288 Q 604 270 609 262 Q 592 272 592 288" fill="#059669"/>

  <!-- ==================== DEVELOPER (BOY) ==================== -->
  <!-- Ergonomic Chair -->
  <rect x="385" y="160" width="80" height="110" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <rect x="420" y="270" width="10" height="40" fill="#1e293b"/>

  <!-- Neck -->
  <rect x="417" y="172" width="16" height="15" fill="#fbcfe8" rx="3"/>
  <!-- Head -->
  <ellipse cx="425" cy="155" rx="20" ry="24" fill="#fed7aa"/>
  <!-- Hair (Modern haircut) -->
  <path d="M 404 150 C 404 130 416 124 427 124 C 443 124 450 134 449 150 C 443 140 433 142 421 143 C 411 144 408 148 404 150 Z" fill="#1e1b4b"/>
  <!-- Ears -->
  <ellipse cx="404" cy="156" rx="3.5" ry="5.5" fill="#fed7aa"/>
  <ellipse cx="446" cy="156" rx="3.5" ry="5.5" fill="#fed7aa"/>
  <!-- Glasses -->
  <rect x="413" y="150" width="10" height="7" rx="2" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="427" y="150" width="10" height="7" rx="2" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="423" y1="153" x2="427" y2="153" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Hoodie Body -->
  <path d="M 390 190 C 400 184 450 184 460 190 L 470 270 L 380 270 Z" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <path d="M 415 190 L 425 208 L 435 190" stroke="#38bdf8" stroke-width="2" fill="none"/>

  <!-- Arms -->
  <path d="M 385 210 L 395 260 L 412 282" stroke="#1e293b" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 465 210 L 455 260 L 438 282" stroke="#1e293b" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Hands on Keyboard (animated typing) -->
  <g class="hands-typing">
    <ellipse cx="412" cy="282" rx="7" ry="5" fill="#fed7aa"/>
    <ellipse cx="438" cy="282" rx="7" ry="5" fill="#fed7aa"/>
  </g>

  <!-- ==================== LAPTOP & SCREEN ==================== -->
  <!-- Laptop Base & Keyboard -->
  <polygon points="360,300 490,300 505,305 345,305" fill="#475569" stroke="#64748b" stroke-width="1"/>
  <rect x="412" y="301" width="26" height="3" rx="1" fill="#334155"/>

  <!-- Laptop Display Screen -->
  <rect x="350" y="215" width="150" height="85" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
  <rect class="screen-glow" x="356" y="221" width="138" height="73" rx="4" fill="#030712" stroke="#38bdf8" stroke-width="1"/>

  <!-- IDE Window Controls -->
  <circle cx="365" cy="227" r="2.2" fill="#ef4444"/>
  <circle cx="372" cy="227" r="2.2" fill="#f59e0b"/>
  <circle cx="379" cy="227" r="2.2" fill="#10b981"/>
  
  <!-- Active Code Lines on Screen -->
  <rect x="365" y="235" width="45" height="2.5" rx="1" fill="#38bdf8"/>
  <rect x="413" y="235" width="30" height="2.5" rx="1" fill="#a855f7"/>
  <rect x="372" y="242" width="60" height="2.5" rx="1" fill="#64748b"/>
  <rect x="372" y="249" width="48" height="2.5" rx="1" fill="#10b981"/>
  <rect x="382" y="256" width="65" height="2.5" rx="1" fill="#38bdf8"/>
  <rect x="382" y="263" width="42" height="2.5" rx="1" fill="#f43f5e"/>
  <rect x="372" y="270" width="24" height="2.5" rx="1" fill="#a855f7"/>
  <rect class="cursor-blink" x="398" y="270" width="3" height="4" fill="#38bdf8"/>

  <!-- ==================== HOLOGRAPHIC TECH BEAMS ==================== -->
  <g opacity="0.3" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2,3">
    <line x1="390" y1="220" x2="200" y2="85"/>
    <line x1="380" y1="225" x2="150" y2="155"/>
    <line x1="375" y1="230" x2="175" y2="230"/>
    <line x1="425" y1="215" x2="425" y2="65"/>
    <line x1="460" y1="220" x2="650" y2="85"/>
    <line x1="470" y1="225" x2="700" y2="155"/>
    <line x1="475" y1="230" x2="680" y2="230"/>
  </g>

  <!-- ==================== FLOATING TECH VISUALIZATIONS ==================== -->

  <!-- 1. CENTER TOP: AI / LLM -->
  <g class="badge-float-1" transform="translate(335, 25)">
    <rect width="180" height="38" rx="19" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.8" filter="url(#badgeShadow)"/>
    <circle cx="22" cy="19" r="11" fill="#7c3aed"/>
    <text x="22" y="23" text-anchor="middle" font-size="12">🧠</text>
    <text x="42" y="24" fill="#f3e8ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">AI • LLM • Gemini • GPT</text>
  </g>

  <!-- 2. TOP LEFT: Python & FastAPI -->
  <g class="badge-float-2" transform="translate(70, 65)">
    <rect width="165" height="38" rx="19" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8" filter="url(#badgeShadow)"/>
    <circle cx="22" cy="19" r="11" fill="#0284c7"/>
    <text x="22" y="23" text-anchor="middle" font-size="12">🐍</text>
    <text x="42" y="24" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Python • FastAPI</text>
  </g>

  <!-- 3. MID LEFT: Voice AI & WebRTC / Twilio -->
  <g class="badge-float-4" transform="translate(30, 138)">
    <rect width="180" height="38" rx="19" fill="#064e3b" stroke="#34d399" stroke-width="1.8" filter="url(#badgeShadow)"/>
    <circle cx="22" cy="19" r="11" fill="#059669"/>
    <text x="22" y="23" text-anchor="middle" font-size="12">🎙️</text>
    <text x="42" y="24" fill="#ecfdf5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Voice AI • WebRTC</text>
  </g>

  <!-- 4. LOW LEFT: Redis & BullMQ -->
  <g class="badge-float-6" transform="translate(65, 212)">
    <rect width="165" height="38" rx="19" fill="#450a0a" stroke="#f87171" stroke-width="1.8" filter="url(#badgeShadow)"/>
    <circle cx="22" cy="19" r="11" fill="#dc2626"/>
    <text x="22" y="23" text-anchor="middle" font-size="12">⚡</text>
    <text x="42" y="24" fill="#fee2e2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Redis • BullMQ</text>
  </g>

  <!-- 5. TOP RIGHT: Next.js & React -->
  <g class="badge-float-3" transform="translate(615, 65)">
    <rect width="165" height="38" rx="19" fill="#0f172a" stroke="#60a5fa" stroke-width="1.8" filter="url(#badgeShadow)"/>
    <circle cx="22" cy="19" r="11" fill="#1e293b"/>
    <text x="22" y="23" text-anchor="middle" font-size="12">⚛️</text>
    <text x="42" y="24" fill="#dbeafe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Next.js • React</text>
  </g>

  <!-- 6. MID RIGHT: TypeScript & Node.js -->
  <g class="badge-float-5" transform="translate(640, 138)">
    <rect width="175" height="38" rx="19" fill="#172554" stroke="#3b82f6" stroke-width="1.8" filter="url(#badgeShadow)"/>
    <circle cx="22" cy="19" r="11" fill="#1d4ed8"/>
    <text x="22" y="23" text-anchor="middle" font-size="12">🔷</text>
    <text x="42" y="24" fill="#eff6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">TypeScript • Node</text>
  </g>

  <!-- 7. LOW RIGHT: MongoDB & PostgreSQL -->
  <g class="badge-float-7" transform="translate(615, 212)">
    <rect width="175" height="38" rx="19" fill="#022c22" stroke="#4ade80" stroke-width="1.8" filter="url(#badgeShadow)"/>
    <circle cx="22" cy="19" r="11" fill="#16a34a"/>
    <text x="22" y="23" text-anchor="middle" font-size="12">🍃</text>
    <text x="42" y="24" fill="#dcfce7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">MongoDB • SQL</text>
  </g>

  <!-- Ambient Glowing Tech Particles -->
  <circle class="badge-float-1" cx="300" cy="120" r="3" fill="#38bdf8" opacity="0.8"/>
  <circle class="badge-float-3" cx="550" cy="120" r="2.5" fill="#a855f7" opacity="0.8"/>
  <circle class="badge-float-2" cx="240" cy="180" r="2.5" fill="#34d399" opacity="0.7"/>
  <circle class="badge-float-5" cx="610" cy="180" r="3" fill="#60a5fa" opacity="0.7"/>
  <circle class="badge-float-4" cx="360" cy="100" r="2" fill="#fbbf24" opacity="0.8"/>
  <circle class="badge-float-6" cx="490" cy="100" r="2" fill="#ec4899" opacity="0.8"/>
</svg>
